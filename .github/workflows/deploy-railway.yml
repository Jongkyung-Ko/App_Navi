# Redeploy on push when GitHub Secrets are configured.
#
# Preferred (project token):
#   RAILWAY_TOKEN — create in Railway Project → Settings → Tokens
#   (NOT Account Settings → Tokens)
#
# Optional:
#   RAILWAY_SERVICE_ID — service id if the project has multiple services
name: Deploy Railway

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Railway token
        id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN secret missing — relying on Railway GitHub autodeploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.check.outputs.skip == 'false'
        # Pin: newer CLI versions have broken project-token auth in CI.
        run: npm install -g @railway/cli@5.2.0

      - name: Deploy
        if: steps.check.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${RAILWAY_SERVICE_ID:-}" ]; then
            railway up --ci --service "$RAILWAY_SERVICE_ID"
          else
            railway up --ci
          fi
