# Redeploy on push when GitHub Secrets are configured.
#
# Required:
#   RAILWAY_TOKEN — Project Settings → Tokens (project token, not account token)
#
# Recommended when the project has multiple services:
#   RAILWAY_SERVICE_ID — service name or id (Railway → service → Settings → Service ID)
name: Deploy Railway

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Railway token
        id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN secret missing — relying on Railway GitHub autodeploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.check.outputs.skip == 'false'
        # Pin: newer CLI versions have broken project-token auth in CI.
        run: npm install -g @railway/cli@5.2.0

      - name: Deploy
        if: steps.check.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          echo "Railway status:"
          railway status || true

          if [ -n "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "Deploying service: $RAILWAY_SERVICE_ID"
            railway up --ci --service "$RAILWAY_SERVICE_ID"
            exit 0
          fi

          # Try common service names when secret is not set.
          for svc in app-navi app_navi App_Navi web server app backend; do
            echo "Trying service: $svc"
            if railway up --ci --service "$svc"; then
              echo "Deployed via service=$svc"
              exit 0
            fi
          done

          echo "::error::Multiple services found. Add GitHub secret RAILWAY_SERVICE_ID (service name or id)."
          exit 1
